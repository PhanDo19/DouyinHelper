<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Local Video Detector</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #17202a;
        background: #f7f9fb;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 700;
      }
      label {
        display: block;
        margin: 8px 0 4px;
        font-size: 12px;
        font-weight: 600;
      }
      input[type="text"], input[type="number"] {
        box-sizing: border-box;
        width: 100%;
        padding: 7px;
        border: 1px solid #ccd4dc;
        border-radius: 6px;
        font: 12px Consolas, monospace;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 8px 10px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #607d8b;
      }
      #status {
        margin-top: 10px;
        padding: 8px;
        border-radius: 6px;
        background: #e8f5e9;
        color: #1b5e20;
        font-size: 12px;
        min-height: 16px;
      }
      .hint {
        margin-top: 8px;
        font-size: 11px;
        line-height: 1.35;
        color: #5d6d7e;
      }
    </style>
  </head>
  <body>
    <h1>Local Video Detector</h1>

    <div class="row">
      <input id="enabled" type="checkbox">
      <label for="enabled" style="margin:0">Enable detection</label>
    </div>

    <label for="port">Local app port</label>
    <input id="port" type="number" min="1" max="65535">

    <label for="token">App token</label>
    <input id="token" type="text" placeholder="Paste token from Browser Detector tab">

    <div class="row">
      <button id="save">Save</button>
      <button id="test" class="secondary">Test</button>
    </div>

    <div id="status"></div>
    <div class="hint">
      Keep the Python app open. The token changes each time the app starts.
      Only clear, accessible media streams are supported; DRM is not supported.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
